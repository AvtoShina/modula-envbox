services:
  db:
    image: mysql:8.0.36
    hostname: mysql
    container_name: mdl-db
    volumes:
      - ./volumes/mysql/data:/var/lib/mysql
      - ./db/structure.sql:/docker-entrypoint-initdb.d/structure.sql:ro
    env_file:
      - .env
    ports:
      - "${DB_PORT}:3306"
    restart: always
    networks:
      - modula-net
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci

  api:
    build:
      context: ${API_DIR}
      dockerfile: ${PWD}/api/${TARGET:-prod}.Dockerfile
    hostname: api
    container_name: mdl-api
    volumes:
      - ${API_DIR}:/src
      - /src/node_modules
      - ${API_DIR}/storage/uploads:/src/storage/uploads
    env_file:
      - ${API_DIR}/.env                      # app's own config (CORS, AmoCRM, …)
    environment:
      - NODE_ENV=production
      - PORT=${API_INTERNAL_PORT}
      - DB_HOST=db                           # override whatever's in app .env
      - DB_PORT=3306
      - DB_USER=${MYSQL_USER}
      - DB_PASS=${MYSQL_PASSWORD}
      - DB_NAME=${MYSQL_DATABASE}
    ports:
      - "${API_PORT}:${API_INTERNAL_PORT}"
    restart: always
    depends_on:
      - db
    networks:
      - modula-net

  front:
    build:
      context: ${FRONT_DIR}
      dockerfile: ${PWD}/front/${TARGET:-prod}.Dockerfile
    hostname: front
    container_name: mdl-front
    volumes:
      - ${FRONT_DIR}:/src
      - /src/node_modules
    restart: always
    networks:
      - modula-net

  nginx:
    image: nginx:1.27-alpine
    container_name: mdl-nginx
    environment:
      - SITE_DOMAIN=${SITE_DOMAIN}
      - API_DOMAIN=${API_DOMAIN}
      - API_UPSTREAM=api:${API_INTERNAL_PORT}
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    ports:
      - "${NGINX_PORT}:80"
    restart: always
    depends_on:
      - api
      - front
    networks:
      - modula-net

networks:
  modula-net:
    driver: bridge
