services:
  db:
    image: mysql:8.0.36
    hostname: mysql
    container_name: mdl-db
    volumes:
      - ./volumes/mysql/data:/var/lib/mysql
      - ./db/structure.sql:/docker-entrypoint-initdb.d/structure.sql:ro
    env_file:
      - .env
    ports:
      - "127.0.0.1:${DB_PORT}:3306"
    restart: always
    networks:
      - modula-net
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci

  api:
    build:
      context: ${API_DIR}
      dockerfile: ${PWD}/api/${TARGET:-prod}.Dockerfile
    hostname: api
    container_name: mdl-api
    volumes:
      - ${API_DIR}/storage/uploads:/src/storage/uploads
    env_file:
      - ${API_DIR}/.env
    environment:
      - NODE_ENV=production
      - PORT=${API_INTERNAL_PORT}
      - TRUST_PROXY=1
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=${MYSQL_USER}
      - DB_PASS=${MYSQL_PASSWORD}
      - DB_NAME=${MYSQL_DATABASE}
    ports:
      - "127.0.0.1:${API_PORT}:${API_INTERNAL_PORT}"
    restart: always
    depends_on:
      - db
    networks:
      - modula-net

  front:
    build:
      context: ${FRONT_DIR}
      dockerfile: ${PWD}/front/${TARGET:-prod}.Dockerfile
    hostname: front
    container_name: mdl-front
    volumes:
      - ${PWD}/front/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:${NGINX_PORT}:80"
    restart: always
    networks:
      - modula-net

networks:
  modula-net:
    driver: bridge
